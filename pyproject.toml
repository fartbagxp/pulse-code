[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-code"
version = "1.1.3"
description = "CDC WONDER query CLI — explore, build, and refine public health data queries"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.6.0",
    "openai==3.14.1",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "socksio==1.0.0",
    "typer==0.27.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pulse = ["data/*.json", "templates/*.xml", "queries/*.xml"]

[project.scripts]
pulse = "pulse.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: exercises real sockets (localhost SOCKS/HTTP servers, or live LLM/CDC WONDER APIs). Excluded by default — run with `-m integration`.",
]
addopts = "-m \"not integration\""
