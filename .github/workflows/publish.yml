name: Publish

# The manual release flow for pulse-code. Run it from the Actions tab and pick a
# semver level. It will:
#   1. bump pyproject.toml + uv.lock with `uv version --bump`
#   2. run the unit tests against the bumped, locked environment
#   3. commit the bump to main and push the tag (vX.Y.Z)
#   4. build the sdist and wheel from that tag
#   5. create the GitHub release and attach the build
#   6. publish to PyPI via trusted publishing
#
# If a later job fails after the tag is pushed, use "Re-run failed jobs" on
# the same run rather than starting a new bump.

on:
  workflow_dispatch:
    inputs:
      level:
        description: Semver level to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

# Never cancel a release halfway through pushing the commit and tag.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # push the bump commit and tag
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout main
        # zizmor: ignore[artipacked] - this job pushes the bump commit and tag, so it needs the token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Bump pyproject.toml and uv.lock
        id: version
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          uv version --bump "$LEVEL"
          version="$(uv version --short)"  # e.g. 1.1.4
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Bumping to ${tag}"

      - name: Install locked environment
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --locked pytest -q

      - name: Commit, tag, and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml uv.lock
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"

          git push origin HEAD:main
          git push origin "refs/tags/${TAG}"

  build:
    name: Build distribution
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Build distribution
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${REPO}" \
            --title "${TAG}" \
            --generate-notes

  publish:
    name: Publish package to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://pypi.org/project/pulse-code/
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
