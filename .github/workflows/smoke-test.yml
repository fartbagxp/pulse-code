name: Smoke test live sources

on:
  schedule:
    # 09:00 UTC daily -- catches upstream CDC/NCI/ATSDR API drift (moved
    # URLs, changed hosting, dead endpoints) before a user hits it. See the
    # NIS URL drift found and documented in the README for the kind of
    # break this is meant to catch early.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: pulse doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: uv sync
      - name: Check every connected data source is reachable
        run: uv run pulse doctor
